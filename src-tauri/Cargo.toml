[package]
name = "auto-fixer-gbef"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
kryoto-repair = { path = "../../kryoto-desktop/crates/kryoto-repair" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
[features]
custom-protocol = ["tauri/custom-protocol"]
