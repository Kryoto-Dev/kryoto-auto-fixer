name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the shared engine and UI
        shell: bash
        run: git clone --depth 1 https://github.com/official-kryo-to/kryoto-desktop.git ../kryoto-desktop
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check app versions
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json")).version;
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            if (pkg !== conf || pkg !== cargo) throw new Error("App versions differ");
          '
      - run: pnpm --dir ../kryoto-desktop install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cargo build --release --features custom-protocol --locked --manifest-path src-tauri/Cargo.toml
      - run: ./target/release/auto-fixer-gbef.exe --self-check
      - name: Verify the portable executable has no separate WebView2 loader
        shell: pwsh
        run: |
          $imports = & dumpbin /dependents target/release/auto-fixer-gbef.exe
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect executable dependencies" }
          if ($imports -match 'WebView2Loader\.dll') { throw "The WebView2 loader must be statically linked" }
      - uses: actions/upload-artifact@v4
        with:
          name: auto-fixer-gbef-windows
          path: target/release/auto-fixer-gbef.exe
          if-no-files-found: error
